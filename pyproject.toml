[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crowd-reaction-analysis"
version = "0.1.0"
description = "Weakly supervised crowd reaction sound event detection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "audiomentations>=0.35.0",
  "dcase_util>=0.2.20",
  "matplotlib==3.10.3",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "PyYAML==6.0.2",
  "sed_eval>=0.2.1",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "soundfile>=0.12,<1",
  "setuptools>=68,<81",
  "transformers>=4.52.4,<4.53",
  "tqdm==4.67.1",
  "wandb>=0.19.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
