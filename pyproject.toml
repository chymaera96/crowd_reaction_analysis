[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crowd-reaction-analysis"
version = "0.2.0"
description = "Crowd reaction annotations with CNN-TCN, BEATs and wav2vec2"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "torch>=2.8,<3",
  "torchaudio>=2.8,<3",
  "numpy>=2.1,<3",
  "matplotlib>=3.10,<4",
  "PyYAML>=6,<7",
  "soundfile>=0.13,<1",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
wav2vec2 = ["transformers>=4.52.4,<5"]
train = [
  "pandas>=2.2,<4",
  "audiomentations>=0.43,<1",
  "dcase_util>=0.2.20",
  "sed_eval>=0.2.1",
  "setuptools>=77,<81",
  "wandb>=0.19,<1",
]
test = ["pytest>=8,<10", "build>=1.2"]

[project.scripts]
crowd-reaction = "crowd_reaction.api:main"
crowd-reaction-download = "crowd_reaction.weights:main"

[project.urls]
Repository = "https://github.com/chymaera96/crowd_reaction_analysis"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crowd_reaction = ["resources/*.yaml", "resources/*.json"]
